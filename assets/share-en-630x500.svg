  <linearGradient id="field" x2="0" y2="1"><stop stop-color="#334d3a"/><stop offset="1" stop-color="#192e28"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#dfea9e" stop-opacity=".35"/><stop offset="1" stop-color="#dfea9e" stop-opacity="0"/></radialGradient>
  <pattern id="mesh" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#d7e7aa" stroke-opacity=".06"/></pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v7" stroke="#def1b5" stroke-opacity=".08" stroke-width="2"/></pattern>
  <clipPath id="crop"><rect x="23" y="193" width="584" height="205" rx="3"/></clipPath>
  <g id="bush"><rect x="-34" y="-24" width="68" height="48" rx="19" fill="#4f7551" stroke="#71975e" stroke-width="2"/><path d="M-27-8q9-14 19-9m15-2q10-5 19 11M-24 9q11-2 15 7m24-5q7 0 13-9" fill="none" stroke="#a4bc74" stroke-width="5" stroke-linecap="round" opacity=".85"/></g>
