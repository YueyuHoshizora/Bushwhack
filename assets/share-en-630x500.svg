<svg xmlns="http://www.w3.org/2000/svg" width="630" height="500" viewBox="0 0 630 500" role="img" aria-labelledby="title desc">
<title id="title">Bushwhack — Ambush, or be ambushed</title>
<desc id="desc">English share card for the top-down survival shooter Bushwhack. A player fires from the grass into a night-time battlefield.</desc>
<defs>
